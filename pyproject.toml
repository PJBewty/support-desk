[project]
name = "support-desk"
version = "0.1.0"
description = "Simple customer support ticket system"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "pydantic[email]>=2.13.5",
    "sqlmodel>=0.0.47",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
